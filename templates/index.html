<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Chatbot</title>
    <link rel="stylesheet" href="/static/style.css?v=1.0">
</head>
<body>

    <header>
        <h1>Academic Chatbot</h1>
    </header>

    <div id="chat-history">
        <div class="message ai-message"><b>AI:</b> Hello! I can help analyze your notes or PDFs. Use the <b>+</b> to upload a file.</div>
    </div>

    <div id="loader">AI is thinking...</div>

    <div class="input-container">
        <form id="chat-form">
            <label for="file-input" class="file-label">+</label>
            <input type="file" id="file-input" accept="image/*,application/pdf" style="display: none;">
            <input type="text" id="user-input" placeholder="Type here..." required autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const historyDiv = document.getElementById('chat-history');
        const loader = document.getElementById('loader');
        const fileInput = document.getElementById('file-input');

        let chatHistory = [{"role": "system", "content": "You are a professional academic assistant."}];

        form.onsubmit = async (e) => {
            e.preventDefault();
            const text = document.getElementById('user-input').value;
            const file = fileInput.files[0];
            
            // Add labels "You:" and "AI:" back in
            historyDiv.innerHTML += `<div class="message user-message"><b>You:</b> ${text}</div>`;
            document.getElementById('user-input').value = '';
            loader.style.display = 'block';
            historyDiv.scrollTop = historyDiv.scrollHeight;

            const formData = new FormData();
            formData.append('message', text);
            formData.append('history', JSON.stringify(chatHistory));
            if (file) formData.append('file', file);

            
            const res = await fetch('/chat', { method: 'POST', body: formData });
            const data = await res.json();
                
            chatHistory.push({"role": "user", "content": text});
            chatHistory.push({"role": "assistant", "content": data.response});
                
            historyDiv.innerHTML += `<div class="message ai-message"><b>AI:</b> ${data.response}</div>`;
            fileInput.value = ''; 

    </script>
</body>
</html>
