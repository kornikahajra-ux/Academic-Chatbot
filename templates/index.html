<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>Academic Chatbot</h1>
    </header>

    <div id="chat-history">
        <div class="message ai-message">Welcome! Upload your notes or PDF using the <b>+</b> button. How can I help you today?</div>
    </div>

    <div id="loader">AI is thinking...</div>

    <div class="input-container">
        <form id="chat-form">
            <label for="file-input" class="file-label">+</label>
            <input type="file" id="file-input" accept="image/*,application/pdf" style="display: none;">
            
            <input type="text" id="user-input" placeholder="Type your question here..." required autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const historyDiv = document.getElementById('chat-history');
        const loader = document.getElementById('loader');
        const fileInput = document.getElementById('file-input');

        let chatHistory = [{"role": "system", "content": "You are a professional academic assistant."}];

        form.onsubmit = async (e) => {
            e.preventDefault();
            const text = document.getElementById('user-input').value;
            const file = fileInput.files[0];
            
            // 1. Add User Message UI
            historyDiv.innerHTML += `<div class="message user-message">${text}</div>`;
            document.getElementById('user-input').value = '';
            loader.style.display = 'block';
            historyDiv.scrollTop = historyDiv.scrollHeight;

            const formData = new FormData();
            formData.append('message', text);
            formData.append('history', JSON.stringify(chatHistory));
            if (file) formData.append('file', file);

            try {
                const res = await fetch('/chat', { method: 'POST', body: formData });
                const data = await res.json();
                
                // 2. Update Context Memory
                chatHistory.push({"role": "user", "content": text});
                chatHistory.push({"role": "assistant", "content": data.response});
                
                // 3. Add AI Message UI
                historyDiv.innerHTML += `<div class="message ai-message">${data.response}</div>`;
                fileInput.value = ''; // Clear file after sending
            } catch (err) {
                historyDiv.innerHTML += `<div class="message ai-message" style="color: #ef4444;">Sorry, I encountered an error. Please try again.</div>`;
            } finally {
                loader.style.display = 'none';
                historyDiv.scrollTop = historyDiv.scrollHeight;
            }
        };
    </script>
</body>
</html>
